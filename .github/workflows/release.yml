name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build installer
        run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v5
        with:
          name: installer-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5.0.0
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run mobile:sync
      - name: Build development APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          mkdir -p "$GITHUB_WORKSPACE/mobile-artifacts"
          cp app/build/outputs/apk/debug/app-debug.apk \
            "$GITHUB_WORKSPACE/mobile-artifacts/lambda-wp-viewer-android-development.apk"
      - name: Check optional Android signing
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os
          names = ("ANDROID_KEYSTORE_BASE64", "ANDROID_KEYSTORE_PASSWORD",
                   "ANDROID_KEY_ALIAS", "ANDROID_KEY_PASSWORD")
          present = [bool(os.environ.get(name)) for name in names]
          if any(present) and not all(present):
              raise SystemExit("Android signing requires all four ANDROID_* secrets.")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"enabled={str(all(present)).lower()}\n")
          PY
      - name: Build signed release APK
        if: steps.signing.outputs.enabled == 'true'
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ORG_GRADLE_PROJECT_android.injected.signing.store.file: ${{ runner.temp }}/android-signing/release.keystore
          ORG_GRADLE_PROJECT_android.injected.signing.store.password: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_android.injected.signing.key.alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_android.injected.signing.key.password: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64, os, pathlib
          directory = pathlib.Path(os.environ["RUNNER_TEMP"]) / "android-signing"
          directory.mkdir(mode=0o700, exist_ok=True)
          keystore = directory / "release.keystore"
          keystore.write_bytes(base64.b64decode("".join(os.environ["ANDROID_KEYSTORE_BASE64"].split()), validate=True))
          keystore.chmod(0o600)
          PY
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk \
            "$GITHUB_WORKSPACE/mobile-artifacts/lambda-wp-viewer-android-release.apk"
      - name: Remove Android signing credentials
        if: always()
        run: rm -rf "$RUNNER_TEMP/android-signing"
      - uses: actions/upload-artifact@v5
        with:
          name: android-downloads
          path: mobile-artifacts/*.apk
          if-no-files-found: error

  ios:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Verify Xcode 26
        run: |
          xcodebuild -version
          xcodebuild -version | grep -Eq '^Xcode 26([.]|$)'
      - run: npm ci
      - run: npm run mobile:sync
      - name: Archive unsigned iOS device build
        run: |
          xcodebuild -project mobile/ios/App/App.xcodeproj -scheme App \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/lambda-wp-viewer-ios-unsigned.xcarchive" \
            CODE_SIGNING_ALLOWED=NO archive
          mkdir -p mobile-artifacts
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/lambda-wp-viewer-ios-unsigned.xcarchive" \
            mobile-artifacts/lambda-wp-viewer-ios-unsigned.xcarchive.zip
          echo "::notice::The unsigned iOS archive is for Xcode signing/export; it cannot be installed directly on an iPhone."
      - name: Check optional iOS signing
        id: signing
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          python3 - <<'PY'
          import os
          names = ("IOS_CERTIFICATE_BASE64", "IOS_CERTIFICATE_PASSWORD",
                   "IOS_PROVISION_PROFILE_BASE64", "IOS_TEAM_ID")
          present = [bool(os.environ.get(name)) for name in names]
          if any(present) and not all(present):
              raise SystemExit("iOS signing requires all four IOS_* secrets.")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"enabled={str(all(present)).lower()}\n")
          PY
      - name: Install iOS signing credentials
        if: steps.signing.outputs.enabled == 'true'
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_EXPORT_METHOD: ${{ vars.IOS_EXPORT_METHOD || 'release-testing' }}
          IOS_EXPORT_OPTIONS_PLIST_BASE64: ${{ secrets.IOS_EXPORT_OPTIONS_PLIST_BASE64 }}
        run: |
          umask 077
          SIGNING_DIR="$RUNNER_TEMP/ios-signing"
          mkdir -p "$SIGNING_DIR"
          python3 - <<'PY'
          import base64, os, pathlib
          directory = pathlib.Path(os.environ["RUNNER_TEMP"]) / "ios-signing"
          for variable, filename in (
              ("IOS_CERTIFICATE_BASE64", "certificate.p12"),
              ("IOS_PROVISION_PROFILE_BASE64", "profile.mobileprovision"),
          ):
              (directory / filename).write_bytes(base64.b64decode("".join(os.environ[variable].split()), validate=True))
          PY
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$SIGNING_DIR/signing.keychain-db"
          security set-keychain-settings -lut 21600 "$SIGNING_DIR/signing.keychain-db"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$SIGNING_DIR/signing.keychain-db"
          security import "$SIGNING_DIR/certificate.p12" -P "$IOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security \
            -t cert -f pkcs12 -k "$SIGNING_DIR/signing.keychain-db"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -k "$KEYCHAIN_PASSWORD" "$SIGNING_DIR/signing.keychain-db" >/dev/null
          security list-keychains -d user -s "$SIGNING_DIR/signing.keychain-db" \
            "$HOME/Library/Keychains/login.keychain-db"
          security cms -D -i "$SIGNING_DIR/profile.mobileprovision" > "$SIGNING_DIR/profile.plist"
          python3 - <<'PY'
          import base64, os, pathlib, plistlib, shutil
          directory = pathlib.Path(os.environ["RUNNER_TEMP"]) / "ios-signing"
          profile = plistlib.loads((directory / "profile.plist").read_bytes())
          team = os.environ["IOS_TEAM_ID"]
          if team not in profile["TeamIdentifier"]:
              raise SystemExit("Provisioning profile does not match IOS_TEAM_ID.")
          bundle_id = profile["Entitlements"]["application-identifier"].split(".", 1)[1]
          if "*" in bundle_id:
              raise SystemExit("Use a distribution profile for an explicit app bundle ID.")
          profile_dir = pathlib.Path.home() / "Library/Developer/Xcode/UserData/Provisioning Profiles"
          profile_dir.mkdir(parents=True, exist_ok=True)
          installed_profile = profile_dir / f'{profile["UUID"]}.mobileprovision'
          # Record the exact path before installation so the always() step can remove it.
          (directory / "installed-profile-path").write_text(str(installed_profile))
          shutil.copyfile(directory / "profile.mobileprovision", installed_profile)
          options = {
              "method": os.environ["IOS_EXPORT_METHOD"],
              "teamID": team,
              "signingStyle": "manual",
              "provisioningProfiles": {bundle_id: profile["UUID"]},
          }
          custom_options = os.environ.get("IOS_EXPORT_OPTIONS_PLIST_BASE64")
          if custom_options:
              options = plistlib.loads(base64.b64decode("".join(custom_options.split()), validate=True))
          (directory / "ExportOptions.plist").write_bytes(plistlib.dumps(options))
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write(f'IOS_PROFILE_UUID={profile["UUID"]}\nIOS_BUNDLE_ID={bundle_id}\n')
          PY
          IDENTITY="$(security find-identity -v -p codesigning "$SIGNING_DIR/signing.keychain-db" \
            | awk '/[0-9A-F]{40}/ {print $2; exit}')"
          test -n "$IDENTITY" || { echo "No valid signing identity in certificate."; exit 1; }
          echo "IOS_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
      - name: Archive and export signed iOS IPA
        if: steps.signing.outputs.enabled == 'true'
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          xcodebuild -project mobile/ios/App/App.xcodeproj -scheme App \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/lambda-wp-viewer-ios-signed.xcarchive" \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="$IOS_SIGNING_IDENTITY" \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" PROVISIONING_PROFILE_SPECIFIER="$IOS_PROFILE_UUID" \
            PRODUCT_BUNDLE_IDENTIFIER="$IOS_BUNDLE_ID" archive
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/lambda-wp-viewer-ios-signed.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ios-signing/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/ios-signing/export"
          shopt -s nullglob
          ipas=("$RUNNER_TEMP/ios-signing/export/"*.ipa)
          test "${#ipas[@]}" -eq 1
          cp "${ipas[0]}" mobile-artifacts/lambda-wp-viewer-ios-signed.ipa
      - name: Remove iOS signing credentials
        if: always()
        run: |
          SIGNING_DIR="$RUNNER_TEMP/ios-signing"
          if [ -f "$SIGNING_DIR/installed-profile-path" ]; then
            rm -f "$(cat "$SIGNING_DIR/installed-profile-path")"
          fi
          if [ -f "$SIGNING_DIR/signing.keychain-db" ]; then
            security delete-keychain "$SIGNING_DIR/signing.keychain-db" || true
          fi
          rm -rf "$SIGNING_DIR"
      - uses: actions/upload-artifact@v5
        with:
          name: ios-downloads
          path: mobile-artifacts/*
          if-no-files-found: error

  release:
    needs: [build, android, ios]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: out
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" \
            --title "LAMBDA Heat Pump Viewer $GITHUB_REF_NAME" --generate-notes
